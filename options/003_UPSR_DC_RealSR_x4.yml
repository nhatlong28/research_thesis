
# general settings
name: 003_UPSR_DC_RealSR_x4
model_target: basicsr.models.upsr_real_model.UPSRRealModel
scale: 4
num_gpu: 1
manual_seed: 1
# find_unused_parameters: True
queue_size: 160

dc:
  enabled: true
  rho: 0.4
  noise_alpha: 0.0
  kernel_path: benchmark/testsets/BSDS10/gaussian_kernel.npy

# dataset and data loader settings
datasets:
  # val_1:
  #   name: BSD10_DC
  #   type: PairedImageDataset
  #   dataroot_gt: benchmark/testsets/BSDS10/gt
  #   dataroot_lq: benchmark/testsets/BSDS10/lq
  #   io_backend:
  #     type: disk
  val_1:
    name: BSD10_DC
    type: SingleImageDataset
    dataroot_lq: benchmark/testsets/BSDS10/lq
    io_backend:
      type: disk
  
degradation:
  # gt_usm: True
  scale: 4
  # the first degradation process
  resize_prob: [0.2, 0.7, 0.1]  # up, down, keep
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  # the second degradation process
  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]  # up, down, keep
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 256 
  resize_back: False
  use_sharp: False

# network structures
network_g:
  target: basicsr.archs.swin_unet_arch.UNetModelSwin
  params:
    image_size: 64
    in_channels: 48
    model_channels: 160
    out_channels: 3
    attention_resolutions: [64,32,16,8]
    dropout: 0
    channel_mult: [1, 2, 2, 4]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: True
    dims: 2
    use_fp16: False
    num_head_channels: 32
    use_scale_shift_norm: True
    resblock_updown: False
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: True
    lq_size: 64
    num_feat: 128

diffusion:
  un: 0.1
  min_noise: 0.4
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 4
    schedule_name: exponential
    schedule_kwargs:
      power: 0.2
    etas_end: 0.99
    steps: 5
    min_noise_level: 0.45
    kappa: 2.0
    weighted_mse: False
    predict_type: xstart
    timestep_respacing: ~
    scale_factor: 1.0
    normalize_input: True
    latent_flag: False

network_mse:
  target: basicsr.archs.atd_real_arch.ATD
  ckpt: 
    path: experiments/pretrained_models/atd_real.pth
    strict_load_mse: true
    param_key_mse: params_ema
  params:
    upscale: 4
    in_chans: 3
    img_size: 64
    embed_dim: 96
    depths: [6, 6, 6, 6, ]
    num_heads: [4, 4, 4, 4, ]
    window_size: 16
    category_size: 128
    num_tokens: 64
    reducted_dim: 8
    convffn_kernel_size: 7
    img_range: 1.
    mlp_ratio: 1
    upsampler: 'pixelshuffledirect'
    resi_connection: '1conv'
    use_checkpoint: false

# autoencoder:
#   target: ldm.models.autoencoder.VQModelTorch
#   ckpt_path: weights/autoencoder/autoencoder_vq_f4.pth
