# path
path:
  # pretrain_network_g: ~
  pretrain_network_g: experiments/pretrained_models/upsr.pth
  strict_load_g: true
  resume_state: ~

# training settings
train:
  use_fp16: true
  ema_decay: 0.999
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    # betas: [0.9, 0.9]

  scheduler:
    type: MultiStepLR
    milestones: [200000]
    gamma: 0.5

  # scheduler:
  #   type: TrueCosineAnnealingLR
  #   T_max: 195000
  #   eta_min: !!float 6e-5

  total_iter: 200000
  warmup_iter: 5000

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    lpips_weight: 0.5

# validation settings
val:
  val_freq: 5000
  suffix: ~
  save_img: true
  pbar: true
  desired_min_size: 64
  chop_size: 512
  chop_stride: 448
  chop_bs: 1
  noise_repeat: false

  metrics: {}

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
